<section >
  <h2 mat-dialog-title>Delete</h2>
  <mat-dialog-content>
    Would you like to delete <strong><em>{{data.title}}</em></strong>?
  </mat-dialog-content>
  <mat-dialog-actions>
    <button matButton mat-dialog-close (click)="onCancel()">No</button>
    <button matButton mat-dialog-close cdkFocusInitial (click)="onConfirm()">Yes</button>
  </mat-dialog-actions>
</section>
